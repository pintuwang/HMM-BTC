name: Log MSTR IV vs HV (calls + puts)

on:
  schedule:
    # GitHub delays scheduled runs heavily: on 2026-09-29 the 15:17/16:47/18:13 UTC
    # schedules actually started at 20:00/21:03/22:11 UTC — all after the close.
    # So fire every hour from 12:07 to 19:07 UTC. Pre-market runs exit immediately,
    # the first run that lands in-session logs live quotes, and every later run that
    # day sees the live rows and skips without calling Yahoo.
    - cron: "7 12-19 * * 1-5"
  workflow_dispatch:           # also callable by an external scheduler (see notes)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: iv-logger
  cancel-in-progress: false

jobs:
  log-iv:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance numpy pandas scipy

      - name: Log IV
        run: python iv_logger.py

      - name: Commit log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/   # -A also stages the one-time removal of the old data/iv_log.csv
          git diff --staged --quiet && exit 0
          git commit -m "chore: log MSTR IV vs HV, calls + puts [skip ci]"
          git pull --rebase origin main
          git push
