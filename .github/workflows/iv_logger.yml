name: Log MSTR IV vs HV (calls + puts)

on:
  schedule:
    # GitHub scheduled runs are best-effort: often delayed 1-3 h, sometimes dropped,
    # worst at :00 and :30. So: three tries at odd minutes, all inside US market hours
    # in both EDT and EST. The script logs the FIRST run that lands in-session and
    # skips the rest; a delayed run that lands after the close is logged as
    # 'after_close' and is replaced if a live run arrives later the same day.
    - cron: "17 15 * * 1-5"   # 11:17 ET summer / 10:17 ET winter
    - cron: "47 16 * * 1-5"   # 12:47 ET / 11:47 ET
    - cron: "13 18 * * 1-5"   # 14:13 ET / 13:13 ET
  workflow_dispatch:           # also callable by an external scheduler (see notes)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: iv-logger
  cancel-in-progress: false

jobs:
  log-iv:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance numpy pandas scipy

      - name: Log IV
        run: python iv_logger.py

      - name: Commit log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/   # -A also stages the one-time removal of the old data/iv_log.csv
          git diff --staged --quiet && exit 0
          git commit -m "chore: log MSTR IV vs HV, calls + puts [skip ci]"
          git pull --rebase origin main
          git push
